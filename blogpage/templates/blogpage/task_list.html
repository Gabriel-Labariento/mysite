{% extends 'blogpage/base_blogpage.html' %}
{% load static %}
    {% block content %}
    <form action="" method="post">
        {%csrf_token%}
        {{form.as_p}}
        <input type="submit" value="Add Task">
    </form>
    <ul>
        {%for task in tasks%}
        <li>{{task.0}} - {{ task.1|date:"Y-m-d"}} </li>
        {%endfor%}
    </ul>
{% endblock %}
